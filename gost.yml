# Example generated by gost-sni. Use `sudo gost-sni` on an installed server
# instead of editing /etc/gost-sni-forward/gost.yml by hand.
services:
  - name: "cloudflare-443"
    addr: ":443"
    bypass: "global-sni-allowlist"
    handler:
      type: tcp
      metadata:
        sniffing: true
        sniffing.timeout: 5s
    listener:
      type: tcp
    forwarder:
      selector:
        strategy: round
      nodes:
        - name: "cloudflare-443-example-com"
          addr: "104.16.1.2:443"
          matcher:
            rule: 'Proto(`tls`) && HostRegexp(`^([a-z0-9-]+\.)*example\.com$`)'
          filter:
            protocol: tls
            host: "example.com"

bypasses:
  - name: "global-sni-allowlist"
    whitelist: true
    matchers:
      - ".example.com"

log:
  output: stderr
  level: info
  format: text
